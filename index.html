<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>まねきねこ料金比較</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#222;--muted:#6b6b6b;--line:#e4e0da;--accent:#e8742c;--accent-soft:#fdeee3;--good:#1f8a4c;--good-soft:#e3f4ea;--warn:#b26a00;--warn-soft:#fff4d6;--chip:#f1eee9}
@media (prefers-color-scheme: dark){:root{--bg:#1b1a19;--card:#252321;--ink:#eee;--muted:#a59f97;--line:#3a3733;--accent:#f08a46;--accent-soft:#3a2a1f;--good:#5cc98a;--good-soft:#1e3328;--warn:#e0a640;--warn-soft:#3a3020;--chip:#302d2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Hiragino Sans","Meiryo","Noto Sans JP",sans-serif}
header{padding:16px 20px 8px}
h1{margin:0;font-size:20px}
.sub{color:var(--muted);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.grp>span.lab{color:var(--muted);font-size:12px;margin-right:2px}
button.chip,label.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;user-select:none}
button.chip.on,label.chip:has(input:checked){background:var(--accent);border-color:var(--accent);color:#fff}
label.chip input{display:none}
input[type=search]{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--card);color:var(--ink);min-width:180px}
details.svc{padding:4px 20px;background:var(--card);border-bottom:1px solid var(--line)}
details.svc summary{cursor:pointer;color:var(--muted);font-size:13px}
details.svc .grp{padding:6px 0}
main{padding:12px 20px 40px}
.count{color:var(--muted);margin:4px 0 8px}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--card);max-height:calc(100vh - 230px)}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th{position:sticky;top:0;background:var(--card);z-index:2;font-size:12px;color:var(--muted);cursor:pointer;text-align:center;border-bottom:2px solid var(--line)}
th.sorted{color:var(--accent)}
td.name,th.name{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
th.name{z-index:3}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--accent-soft)}
td.min{background:var(--good-soft);color:var(--good);font-weight:700}
td.na{color:var(--muted);font-size:12px}
.badge{display:inline-block;font-size:11px;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}
.b-upd{background:var(--warn-soft);color:var(--warn)}
.b-room{background:#e6efff;color:#2457b8}
.b-tgt{background:var(--chip);color:var(--muted)}
.b-chk{background:var(--warn-soft);color:var(--warn)}
.calc{font-style:italic}
.legend{color:var(--muted);font-size:12px;margin-top:8px}
/* 詳細 */
#detail{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}
#detail.open{display:block}
#panel{position:absolute;right:0;top:0;bottom:0;width:min(760px,100%);background:var(--bg);overflow:auto;padding:20px;box-shadow:-4px 0 20px rgba(0,0,0,.15)}
#panel h2{margin:0 0 4px;font-size:20px}
#panel h3{font-size:15px;margin:18px 0 6px;border-left:4px solid var(--accent);padding-left:8px}
#panel table{width:auto;min-width:60%}
#panel td,#panel th{text-align:left;position:static;font-size:13px;white-space:normal}
#panel th{color:var(--muted);font-weight:normal;cursor:default}
.close{float:right;border:none;background:var(--chip);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
.kv{display:grid;grid-template-columns:110px 1fr;gap:2px 10px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
.note{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;white-space:pre-wrap}
.links a{color:var(--accent);margin-right:14px}
ul.news{padding-left:18px;font-size:13px}
@media (max-width:700px){.bar{position:static}header,main,.bar,details.svc{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<header>
  <h1>まねきねこ 料金比較</h1>
  <div class="sub" id="meta"></div>
</header>
<div class="bar">
  <div class="grp" id="prefs"><span class="lab">都県</span></div>
  <div class="grp"><span class="lab">会員</span>
    <button class="chip on" data-mem="m">会員</button><button class="chip" data-mem="g">一般</button></div>
  <div class="grp"><span class="lab">曜日</span>
    <button class="chip on" data-day="wd">平日</button><button class="chip" data-day="we">週末</button></div>
  <div class="grp"><span class="lab">料金表</span>
    <button class="chip on" data-tgt="multi">2名以上・全員</button><button class="chip" data-tgt="1名様">1名様の表も</button></div>
  <input type="search" id="q" placeholder="店舗名・住所・駅で検索">
</div>
<details class="svc"><summary>サービス・条件で絞り込む</summary><div class="grp" id="svcs"></div></details>
<main>
  <div class="count" id="count"></div>
  <div class="wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  <div class="legend">
    金額はすべて税込・お1人様（<span class="badge b-room">1部屋</span>の店は1部屋あたり）。30分料金は30分あたり、フリー・パックは1回あたり。
    「平日」は昼=月〜金・祝前、夜=月〜木。「週末」は昼=土日祝、夜=金・祝前・土日祝。<b style="color:var(--good)">緑</b>＝表示中の店舗で最安。
    <span class="calc">斜体</span>＝「会員料金＋一律上乗せ」で計算した一般料金。— は未実施・記載なし。
    曜日や時間の例外は店舗をクリックして「例外・注記」を確認してください。
  </div>
</main>
<div id="detail"><div id="panel"></div></div>

  $("#panel").innerHTML = h;
  $("#detail").classList.add("open");
  $("#panel .close").onclick = () => $("#detail").classList.remove("open");
}

// ---- 操作 ----
const prefs = [...new Set(rows.map(r => r.pref).filter(Boolean))];
$("#prefs").insertAdjacentHTML("beforeend", prefs.map(p => `<button class="chip" data-pref="${esc(p)}">${esc(p)}</button>`).join(""));
const svcCount = {};
rows.forEach(r => r.svc.forEach(s => svcCount[s] = (svcCount[s] || 0) + 1));
const svcList = Object.keys(svcCount).filter(s => svcCount[s] < rows.length && s !== "求人").sort((a, b) => svcCount[b] - svcCount[a]);
$("#svcs").innerHTML = svcList.map(s => `<label class="chip"><input type="checkbox" value="${esc(s)}">${esc(s)} <span class="sub">${svcCount[s]}</span></label>`).join("");
document.addEventListener("click", e => {
  const b = e.target.closest("button.chip");
  if (b) {
    if (b.dataset.mem) { state.mem = b.dataset.mem; document.querySelectorAll("[data-mem]").forEach(x => x.classList.toggle("on", x === b)); }
    if (b.dataset.day) { state.day = b.dataset.day; document.querySelectorAll("[data-day]").forEach(x => x.classList.toggle("on", x === b)); }
    if (b.dataset.tgt) { state.tgt = b.dataset.tgt; document.querySelectorAll("[data-tgt]").forEach(x => x.classList.toggle("on", x === b)); }
    if (b.dataset.pref) { state.prefs.has(b.dataset.pref) ? state.prefs.delete(b.dataset.pref) : state.prefs.add(b.dataset.pref); b.classList.toggle("on"); }
    render(); return;
  }
  const th = e.target.closest("th[data-sort]");
  if (th) {
    const c = th.dataset.sort;
    if (c === "name") { state.sort = {col: null, asc: true}; }
    else state.sort = {col: c, asc: state.sort.col === c ? !state.sort.asc : true};
    render(); return;
  }
  const tr = e.target.closest("tbody tr");
  if (tr && !e.target.closest("#panel")) { detail(rows[+tr.dataset.i]); return; }
  if (e.target.id === "detail") $("#detail").classList.remove("open");
});
$("#svcs").addEventListener("change", e => { e.target.checked ? state.svcs.add(e.target.value) : state.svcs.delete(e.target.value); render(); });
$("#q").addEventListener("input", e => { state.q = e.target.value.trim(); render(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#detail").classList.remove("open"); });
const upd = rows.filter(r => r.updated).length;
$("#meta").innerHTML = `料金：入力表 ${rows.length}行 ／ 公式ページ情報：${esc(D.webDate || "未取得")} ／ 画面作成：${esc(D.built)}` +
  (upd ? ` ／ <b style="color:var(--warn)">PDF更新あり ${upd}店舗（要更新.html を確認）</b>` : "");
render();
</script>
</body>
</html>
